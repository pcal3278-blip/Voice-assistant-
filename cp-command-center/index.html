<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12201f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CP Command">
<link rel="manifest" href="./manifest.json">
<title>CP Command Center</title>
<style>
:root{color-scheme:light;--bg:#f6f3eb;--ink:#18211f;--muted:#66736f;--panel:#fffdf7;--line:#ddd7ca;--green:#1f7a68;--blue:#315f8c;--warn:#986f19;--red:#b33b3b}*{box-sizing:border-box}[hidden]{display:none!important}body{min-width:320px;margin:0;background:linear-gradient(180deg,#eef5f2,var(--bg));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow-x:hidden}.app{max-width:540px;min-height:100vh;margin:auto;padding:max(1rem,env(safe-area-inset-top)) .9rem calc(7rem + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start}.eyebrow,.muted{color:var(--muted);font-size:.9rem;line-height:1.35}h1{font-size:2rem;line-height:1.05;margin:.1rem 0}h2{font-size:1.08rem;margin:0 0 .75rem}.card{border:1px solid var(--line);border-radius:8px;background:rgba(255,253,247,.95);box-shadow:0 12px 32px rgba(43,52,48,.12);padding:1rem;margin:.85rem 0}.hero{display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-height:7rem}.hero strong{display:block;font-size:1.45rem;line-height:1.15}.pill{display:inline-flex;align-items:center;min-height:2rem;border-radius:999px;background:#e5f1ee;color:#175e50;font-weight:750;font-size:.78rem;padding:.35rem .55rem;white-space:nowrap}.banner{padding:.8rem;border:1px solid #c7b46f;border-radius:8px;background:#fff7d8;color:#514116;line-height:1.35}.screen{display:none}.screen.active{display:block}label{display:grid;gap:.35rem;margin:.7rem 0;color:var(--muted);font-size:.88rem;font-weight:700}input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:#fffefa;color:var(--ink);font:inherit;padding:.7rem;outline:none}textarea{resize:vertical;line-height:1.4}.row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}.btn{border:0;border-radius:8px;min-height:44px;padding:0 .75rem;font:inherit;font-weight:750;background:#e9efea;color:var(--ink)}.primary{width:100%;background:var(--green);color:#fff}.danger{width:100%;background:#f7dddd;color:var(--red)}.icon{width:46px;height:46px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-size:1.1rem}.list{display:grid;gap:.65rem;margin-top:.8rem}.item{border:1px solid var(--line);border-radius:8px;background:#fffdf7;padding:.8rem}.item h3{font-size:1rem;margin:0 0 .3rem;overflow-wrap:anywhere}.item p{margin:.25rem 0;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}.actions button{min-height:36px;border:0;border-radius:8px;padding:0 .6rem;background:#e9efea;font-weight:700}.empty{border:1px dashed var(--line);border-radius:8px;padding:.9rem;text-align:center;color:var(--muted)}nav{position:fixed;left:max(.65rem,calc((100vw - 540px)/2 + .65rem));right:max(.65rem,calc((100vw - 540px)/2 + .65rem));bottom:max(.55rem,env(safe-area-inset-bottom));display:grid;grid-auto-flow:column;grid-auto-columns:minmax(4.2rem,1fr);gap:.35rem;overflow-x:auto;padding:.45rem;border:1px solid var(--line);border-radius:8px;background:rgba(255,253,247,.97);box-shadow:0 12px 32px rgba(43,52,48,.12)}nav button{display:grid;place-items:center;gap:.1rem;min-width:4.2rem;min-height:56px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:.72rem;font-weight:750}nav button span{font-size:1rem}nav button.active{background:#dcece8;color:var(--ink)}.startup{max-width:520px;margin:auto;padding:calc(1.5rem + env(safe-area-inset-top)) 1rem}.startup strong{font-size:1.35rem}@media(max-width:370px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="startup" class="startup"><strong>CP Command Center</strong><p>Loading your dashboard...</p></div>
<div id="app" class="app" hidden>
<header><div><p class="eyebrow">CP Command Center</p><h1 id="title">Today</h1><p class="muted">Local data stays on this device.</p></div><button class="icon" id="exportTop" aria-label="Export data">EX</button></header>
<div id="offline" class="banner" hidden>Offline mode: saved data is available. Live connections wait until the network is back.</div>
<main id="screens"></main><nav id="tabs" aria-label="Primary sections"></nav>
</div>
<script>
(function(){
'use strict';
const KEY='cp-command-center-v4';
const tabs=[['daily','Daily','D'],['weather','Weather','W'],['commute','LIRR','T'],['home','Home','H'],['mpg','MPG','M'],['wildlife','Wildlife','B'],['retirement','Retire','R'],['work','Work','N'],['health','Health','+'],['vacation','Vacation','V'],['settings','Settings','S'],['help','Help','?']];
const defaults={dailyNotes:'',homeLocation:'',regularTrain:'',commuteNotes:'',weatherKey:'',lirrKey:'',deploymentUrl:location.href,home:[],mpg:[],wildlife:[],retirement:[],work:[],health:[],vacation:[]};
let state=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderDailyCards()}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function byDate(a,b){return String(b.date||b.dueDate||'').localeCompare(String(a.date||a.dueDate||''))}
function addScreen(id,html){screens.insertAdjacentHTML('beforeend',`<section class="screen" id="${id}">${html}</section>`)}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function bindForm(id,collection,required){const form=document.getElementById(id);form.addEventListener('submit',e=>{e.preventDefault();const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...formData(form)};if(required&& !item[required])return;state[collection].unshift(item);form.reset();save();drawLists()})}
function item(title,lines,actions=''){return `<article class="item"><h3>${esc(title)}</h3>${lines.filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')}<div class="actions">${actions}</div></article>`}
function empty(t){return `<div class="empty">${esc(t)}</div>`}
function removeFrom(col,id){state[col]=state[col].filter(x=>x.id!==id);save();drawLists()}
function doneHome(id){const x=state.home.find(v=>v.id===id);if(x){x.done=!x.done;x.doneDate=x.done?today():'';save();drawLists()}}
function renderList(col,el,mapper,emptyText){const arr=[...state[col]].sort(byDate);document.getElementById(el).innerHTML=arr.length?arr.map(mapper).join(''):empty(emptyText)}
function drawLists(){
renderDailyCards();
const open=state.home.filter(x=>!x.done), done=state.home.filter(x=>x.done);
document.getElementById('homeOpenCount').textContent=open.length;
document.getElementById('homeList').innerHTML=open.length?open.map(x=>item(x.title,[x.dueDate&&`Due ${x.dueDate}`,x.category,x.notes],`<button data-done="${x.id}">Done</button><button data-del="home:${x.id}">Delete</button>`)).join(''):empty('No open home tasks.');
document.getElementById('homeDone').innerHTML=done.length?done.map(x=>item(x.title,[x.doneDate&&`Done ${x.doneDate}`,x.category,x.notes],`<button data-done="${x.id}">Reopen</button><button data-del="home:${x.id}">Delete</button>`)).join(''):empty('No completed tasks yet.');
renderList('mpg','mpgList',x=>{let mpg=x.gallons?Number(x.odometer||0)/Number(x.gallons||1):'';return item(`${x.vehicle||'Vehicle'} ${x.date||''}`,[x.odometer&&`Odometer ${x.odometer}`,x.gallons&&`Gallons ${x.gallons}`,x.totalCost&&`Cost $${x.totalCost}`,mpg?`Simple ratio ${mpg.toFixed(1)}`:'',x.notes],`<button data-del="mpg:${x.id}">Delete</button>`)},'No fill-ups saved.');
renderList('wildlife','wildlifeList',x=>item(x.animal,[x.date,x.location,x.notes],`<button data-del="wildlife:${x.id}">Delete</button>`),'No sightings saved.');
renderList('retirement','retirementList',x=>item(x.date||'Retirement entry',[x.k401&&`401(k): ${x.k401}`,x.b457&&`457(b): ${x.b457}`,x.targetAge&&`Target age: ${x.targetAge}`,x.serviceNotes,x.pensionNotes],`<button data-del="retirement:${x.id}">Delete</button>`),'No retirement entries saved.');
renderList('work','workList',x=>item(x.issue||'Work note',[x.date,x.location,x.equipment,x.action,x.followUp?'Follow-up needed':''],`<button data-del="work:${x.id}">Delete</button>`),'No work notes saved.');
renderList('health','healthList',x=>item(x.date||'Health entry',[x.sleep&&`Sleep: ${x.sleep}`,x.recovery&&`Recovery: ${x.recovery}`,x.bloodPressure&&`BP: ${x.bloodPressure}`,x.weight&&`Weight: ${x.weight}`,x.glucose,x.notes],`<button data-del="health:${x.id}">Delete</button>`),'No health metrics saved.');
renderList('vacation','vacationList',x=>item(x.trip,[x.startDate&&`${x.startDate} to ${x.endDate||''}`,x.hotel,x.flight,x.cost&&`Cost $${x.cost}`,x.confirmation,x.todo],`<button data-del="vacation:${x.id}">Delete</button>`),'No trips saved.');
}
function renderDailyCards(){let open=state.home.filter(x=>!x.done).length;briefCards.innerHTML=[item('Home Maintenance',[`${open} open task${open===1?'':'s'}`]),item('Weather',[state.weatherKey?'API key saved. Live provider wiring is intentionally not faked.':'Setup required: add a real weather API key in Settings.']),item('LIRR / Commute',[state.lirrKey?'Transit API key saved. Live departure wiring is intentionally not faked.':'Setup required: add a real transit API key in Settings.',state.regularTrain&&`Regular train: ${state.regularTrain}`]),item('Today Notes',[state.dailyNotes||'No daily notes yet.'])].join('')}
function setTab(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));title.textContent=tabs.find(t=>t[0]===id)?.[1]||'Today';location.hash=id}
function build(){
startup.hidden=true;app.hidden=false;
tabs.forEach(([id,label,icon])=>{document.getElementById('tabs').insertAdjacentHTML('beforeend',`<button data-tab="${id}"><span>${icon}</span>${label}</button>`)});
addScreen('daily',`<section class="card hero"><div><p class="muted">Daily Brief</p><strong>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</strong></div><span class="pill">Private local PWA</span></section><section class="card"><h2>Manual Notes</h2><textarea id="dailyNotes" rows="5" placeholder="Notes for today"></textarea></section><section id="briefCards"></section>`);
addScreen('weather',`<section class="card"><h2>Weather</h2><label>Home location<input id="homeLocation" autocomplete="address-level2"></label><p class="banner">No fake live weather is shown. Add a real API key in Settings, then connect a provider before trusting live conditions.</p></section>`);
addScreen('commute',`<section class="card"><h2>LIRR Babylon Line / Commute</h2><label>Regular train<input id="regularTrain"></label><label>Commute notes<textarea id="commuteNotes" rows="5"></textarea></label><p class="banner">No fake LIRR departures are shown. Add a real transit API key in Settings before live commute data appears.</p></section>`);
addScreen('home',`<section class="card"><h2>Home Maintenance</h2><form id="homeForm"><input name="title" required placeholder="Task title"><div class="row"><input name="dueDate" type="date"><input name="category" placeholder="Category"></div><textarea name="notes" rows="3" placeholder="Notes"></textarea><button class="btn primary">Add Task</button></form></section><section class="card"><h2>Open Tasks <span id="homeOpenCount" class="pill">0</span></h2><div id="homeList" class="list"></div></section><section class="card"><h2>Completed History</h2><div id="homeDone" class="list"></div></section>`);
addScreen('mpg',`<section class="card"><h2>MPG Tracker</h2><form id="mpgForm"><div class="row"><input name="date" type="date" required><input name="vehicle" placeholder="Vehicle"></div><div class="row"><input name="odometer" type="number" inputmode="numeric" placeholder="Odometer"><input name="gallons" type="number" step="0.001" inputmode="decimal" placeholder="Gallons"></div><div class="row"><input name="totalCost" type="number" step="0.01" placeholder="Total cost"><input name="notes" placeholder="Notes"></div><button class="btn primary">Save Fill-Up</button></form></section><section class="card"><h2>History</h2><div id="mpgList" class="list"></div></section>`);
addScreen('wildlife',`<section class="card"><h2>Bird and Wildlife Sightings</h2><form id="wildlifeForm"><div class="row"><input name="date" type="date" required><input name="animal" required placeholder="Animal or bird"></div><input name="location" placeholder="Location"><textarea name="notes" rows="3" placeholder="Notes or photo reminder"></textarea><button class="btn primary">Save Sighting</button></form></section><section class="card"><h2>Sightings History</h2><div id="wildlifeList" class="list"></div></section>`);
addScreen('retirement',`<section class="card"><h2>Retirement Tracker</h2><p class="muted">Tracking only. No financial advice is provided.</p><form id="retirementForm"><input name="date" type="date" required><div class="row"><input name="k401" placeholder="401(k)"><input name="b457" placeholder="457(b)"></div><div class="row"><input name="targetAge" placeholder="Target age"><input name="serviceNotes" placeholder="Years of service notes"></div><textarea name="pensionNotes" rows="3" placeholder="Pension notes"></textarea><button class="btn primary">Save Entry</button></form></section><section class="card"><h2>History</h2><div id="retirementList" class="list"></div></section>`);
addScreen('work',`<section class="card"><h2>Work Notes</h2><form id="workForm"><div class="row"><input name="date" type="date" required><input name="location" placeholder="Location"></div><input name="equipment" placeholder="Equipment"><textarea name="issue" rows="3" placeholder="Issue"></textarea><textarea name="action" rows="3" placeholder="Action taken"></textarea><label><input name="followUp" type="checkbox" value="yes"> Follow-up needed</label><button class="btn primary">Save Work Note</button></form></section><section class="card"><h2>Saved Notes</h2><div id="workList" class="list"></div></section>`);
addScreen('health',`<section class="card"><h2>Health Metrics</h2><p class="muted">Tracking only. No medical advice is provided.</p><form id="healthForm"><input name="date" type="date" required><div class="row"><input name="sleep" placeholder="Sleep"><input name="recovery" placeholder="Recovery"></div><div class="row"><input name="bloodPressure" placeholder="Blood pressure"><input name="weight" placeholder="Weight"></div><input name="glucose" placeholder="Glucose notes"><textarea name="notes" rows="3" placeholder="General notes"></textarea><button class="btn primary">Save Metrics</button></form></section><section class="card"><h2>History</h2><div id="healthList" class="list"></div></section>`);
addScreen('vacation',`<section class="card"><h2>Vacation Planner</h2><form id="vacationForm"><input name="trip" required placeholder="Trip"><div class="row"><input name="startDate" type="date"><input name="endDate" type="date"></div><div class="row"><input name="hotel" placeholder="Hotel"><input name="flight" placeholder="Flight"></div><input name="cost" type="number" step="0.01" placeholder="Cost"><textarea name="confirmation" rows="3" placeholder="Confirmation notes"></textarea><textarea name="todo" rows="3" placeholder="Things to do"></textarea><button class="btn primary">Save Trip</button></form></section><section class="card"><h2>Trips</h2><div id="vacationList" class="list"></div></section>`);
addScreen('settings',`<section class="card"><h2>Settings</h2><label>Weather API key<input id="weatherKey" type="password" autocomplete="off" placeholder="Optional"></label><label>LIRR / transit API key<input id="lirrKey" type="password" autocomplete="off" placeholder="Optional"></label><label>Deployment URL<input id="deploymentUrl" type="url"></label><div class="row"><button class="btn" id="exportBtn">Export Data</button><label class="btn">Import Data<input id="importFile" type="file" accept="application/json" hidden></label></div><button class="btn danger" id="clearBtn">Clear Local Data</button><p class="banner">Build 2026.06.18. Data is stored in this browser with localStorage.</p></section>`);
addScreen('help',`<section class="card"><h2>Help / Troubleshooting</h2><p>Use the public HTTPS URL, not localhost, 192.168.x.x, AirDrop, Verizon Cloud, iCloud Drive, or direct file opening.</p><p>For iPhone: open the HTTPS URL in Safari, tap Share, then Add to Home Screen. It works on cellular after deployment.</p><p>If the app opens blank, clear Safari website data for this site and reload. Startup errors are shown as visible banners instead of a white screen.</p></section>`);
['dailyNotes','homeLocation','regularTrain','commuteNotes','weatherKey','lirrKey','deploymentUrl'].forEach(id=>{let el=document.getElementById(id);if(el){el.value=state[id]||'';el.addEventListener('input',()=>{state[id]=el.value;save()})}});
['home','mpg','wildlife','retirement','work','health','vacation'].forEach(c=>bindForm(c+'Form',c,c==='home'?'title':c==='vacation'?'trip':c==='wildlife'?'animal':null));
document.body.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab)setTab(b.dataset.tab);if(b.dataset.del){let [c,id]=b.dataset.del.split(':');removeFrom(c,id)}if(b.dataset.done)doneHome(b.dataset.done)});
exportBtn.onclick=exportTop.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='cp-command-center-data.json';a.click();URL.revokeObjectURL(a.href)};
importFile.onchange=async()=>{let f=importFile.files[0];if(!f)return;state={...defaults,...JSON.parse(await f.text())};save();location.reload()};
clearBtn.onclick=()=>{if(confirm('Clear all local CP Command Center data on this device?')){localStorage.removeItem(KEY);location.reload()}};
window.addEventListener('online',()=>offline.hidden=true);window.addEventListener('offline',()=>offline.hidden=false);offline.hidden=navigator.onLine;
drawLists();setTab((location.hash||'#daily').slice(1));
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);
}
try{build()}catch(err){startup.innerHTML='<strong>Startup error</strong><p>'+esc(err.message)+'</p>';console.error(err)}
})();
</script>
</body>
</html>
