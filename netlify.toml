[build]
  publish = "cp-command-center"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/manifest.json"
  to = "/site.json"
  status = 200
